[tool.poetry]
name = "job-intelligent-dashboard"
version = "0.1.0"
description = "Data pipeline and recommendation engine for job insights."
authors = ["Data Team"]
readme = "README.md"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
